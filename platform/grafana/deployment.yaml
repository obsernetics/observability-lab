apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels: { app: grafana }
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Admin" }
            - { name: GF_USERS_DEFAULT_THEME, value: "dark" }
            - { name: GF_SECURITY_ALLOW_EMBEDDING, value: "true" }
            - { name: GF_FEATURE_TOGGLES_ENABLE, value: "" }
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dash-provider, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - { name: datasources, configMap: { name: grafana-datasources } }
        - { name: dash-provider, configMap: { name: grafana-dashboard-provider } }
        - { name: dashboards, configMap: { name: grafana-dashboards } }
