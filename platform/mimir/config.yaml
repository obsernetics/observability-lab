apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: observability
data:
  mimir.yaml: |
    multitenancy_enabled: false
    server:
      http_listen_port: 8080
      grpc_listen_port: 9095
      log_level: warn
    common:
      storage:
        backend: filesystem
        filesystem:
          dir: /data/common
    blocks_storage:
      backend: filesystem
      filesystem:
        dir: /data/blocks
      bucket_store:
        sync_dir: /data/tsdb-sync
      tsdb:
        dir: /data/tsdb
    compactor:
      data_dir: /data/compactor
    ingester:
      ring:
        replication_factor: 1
    store_gateway:
      sharding_ring:
        replication_factor: 1
    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /data/ruler
    activity_tracker:
      filepath: /data/metrics-activity.log
    usage_stats:
      enabled: false
    memberlist:
      join_members: []
