apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
  namespace: observability
  labels: { app: mimir }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mimir }
  template:
    metadata:
      labels: { app: mimir }
    spec:
      containers:
        - name: mimir
          image: grafana/mimir:2.14.2
          args: ["-config.file=/etc/mimir/mimir.yaml"]
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: config, mountPath: /etc/mimir }
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: config
          configMap: { name: mimir-config }
        - name: data
          emptyDir: {}
